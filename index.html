<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YANN MERCADAL — Concept Artist & 3D Sculptor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0b0d;
      color: #e5e7eb;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0b0d;
    }
    ::-webkit-scrollbar-thumb {
      background: #262626;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #404040;
    }

    .card-zoom-img {
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .group:hover .card-zoom-img {
      transform: scale(1.05);
    }

    /* --- NOUVEAUX STYLES POUR LA BANNIÈRE INCURVÉE (SANS DÉGRADÉ) --- */
    .banner-container {
      position: relative;
      width: 100%;
      height: 400px;
      overflow: hidden;
      background-color: #0b0b0d;
    }

    .banner-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      /* Votre image appliquée directement sans aucun dégradé */
      background-image: url('image_kmRxgB.png'); 
      background-size: cover;
      background-position: center center;
      /* Découpe nette en arc de cercle inversé sur le bas */
      clip-path: ellipse(80% 60% at 50% 30%);
    }

    .banner-content {
      position: relative;
      z-index: 2;
      max-width: 80rem;
      margin: 0 auto;
      padding: 40px 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    @media (max-width: 768px) {
      .banner-container {
        height: 320px;
      }
      .banner-content {
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 24px;
      }
      .banner-background {
        clip-path: ellipse(120% 60% at 50% 30%);
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-amber-500/20 selection:text-amber-300">

  <!-- BANNIÈRE INCURVÉE AVEC VOTRE IMAGE -->
  <header class="banner-container">
    <div class="banner-background"></div>
    
    <div class="banner-content">
      <!-- GAUCHE : Nom & Sous-titre -->
      <div class="flex flex-col cursor-pointer" onclick="showHome()">
        <h1 class="text-2xl md:text-3xl font-extrabold tracking-[0.2em] text-white uppercase hover:text-amber-400 transition-colors drop-shadow-[0_2px_4px_rgba(0,0,0,0.7)]">
          YANN MERCADAL
        </h1>
        <p class="text-[11px] md:text-xs tracking-[0.25em] text-neutral-200 uppercase font-medium mt-1 drop-shadow-[0_1px_3px_rgba(0,0,0,0.7)]">
          CONCEPT ARTIST 2D & 3D
        </p>
      </div>

      <!-- DROITE : Navigation & Réseaux -->
      <nav class="flex items-center flex-wrap justify-center gap-3 md:gap-4 text-xs tracking-[0.18em] uppercase">
        <a href="https://www.artstation.com/yannm" target="_blank" rel="noopener noreferrer" class="px-3.5 py-2 rounded bg-black/50 backdrop-blur-sm border border-neutral-700/50 text-neutral-200 hover:text-white hover:border-amber-500/60 hover:bg-black/70 transition-all drop-shadow-md">
          ArtStation
        </a>
        <a href="https://www.linkedin.com/in/yann-mercadal-8489923b4/" target="_blank" rel="noopener noreferrer" class="px-3.5 py-2 rounded bg-black/50 backdrop-blur-sm border border-neutral-700/50 text-neutral-200 hover:text-white hover:border-amber-500/60 hover:bg-black/70 transition-all drop-shadow-md">
          LinkedIn
        </a>
        <a href="mailto:mercadal.yann77@gmail.com" class="px-3.5 py-2 rounded bg-black/50 backdrop-blur-sm border border-neutral-700/50 text-neutral-200 hover:text-white hover:border-amber-500/60 hover:bg-black/70 transition-all drop-shadow-md">
          Email
        </a>
        <button onclick="openAboutModal()" class="px-4 py-2 rounded bg-amber-500/20 backdrop-blur-sm border border-amber-500/60 text-amber-300 hover:bg-amber-500 hover:text-black font-semibold transition-all drop-shadow-md">
          À Propos
        </button>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 md:px-10 py-10 flex-grow w-full">
    
    <!-- SUB-NAVIGATION BAR (Hidden on Home, visible when browsing category) -->
    <div id="categoryHeader" class="hidden flex flex-col md:flex-row md:items-center justify-between pb-8 mb-8 border-b border-neutral-800 gap-4">
      <button onclick="showHome()" class="inline-flex items-center space-x-2 text-xs uppercase tracking-[0.2em] text-neutral-400 hover:text-white transition-colors bg-neutral-900 border border-neutral-800 hover:border-neutral-700 px-4 py-2.5 rounded">
        <span>← ACCUEIL / CATÉGORIES</span>
      </button>
      <div id="activeCategoryTitle" class="text-sm md:text-base font-bold tracking-[0.3em] uppercase text-amber-400">
        <!-- Dynamic Category Name -->
      </div>
    </div>

    <!-- HOME VIEW (3 MAIN CATEGORY CARDS WITH ROBUST FALLBACKS) -->
    <section id="homeView" class="grid grid-cols-1 md:grid-cols-3 gap-8">
      
      <!-- CATEGORY 1: CONCEPT ART -->
      <div onclick="openCategory('concept-art', 'CONCEPT ART')" class="group relative aspect-[3/4] rounded-lg overflow-hidden cursor-pointer bg-neutral-900 border border-neutral-800/80 hover:border-amber-500/50 transition-all duration-300 shadow-xl">
        <img src="yann-mercadal-final (4).jpg" 
             onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1579783902614-a3fb3927b675?auto=format&fit=crop&w=1000&q=80';" 
             alt="Concept Art" 
             class="card-zoom-img w-full h-full object-cover">
        <div class="absolute inset-0 bg-black/40 group-hover:bg-black/20 transition-colors duration-300 flex items-center justify-center p-6 text-center">
          <h2 class="text-2xl md:text-3xl font-extrabold tracking-[0.3em] text-white uppercase drop-shadow-lg group-hover:text-amber-400 transition-colors">
            CONCEPT ART
          </h2>
        </div>
      </div>

      <!-- CATEGORY 2: SCULPTURE -->
      <div onclick="openCategory('sculpture', 'SCULPTURE')" class="group relative aspect-[3/4] rounded-lg overflow-hidden cursor-pointer bg-neutral-900 border border-neutral-800/80 hover:border-amber-500/50 transition-all duration-300 shadow-xl">
        <img src="merya-render-artstation.jpg" 
             onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1000&q=80';" 
             alt="Sculpture" 
             class="card-zoom-img w-full h-full object-cover">
        <div class="absolute inset-0 bg-black/40 group-hover:bg-black/20 transition-colors duration-300 flex items-center justify-center p-6 text-center">
          <h2 class="text-2xl md:text-3xl font-extrabold tracking-[0.3em] text-white uppercase drop-shadow-lg group-hover:text-amber-400 transition-colors">
            SCULPTURE
          </h2>
        </div>
      </div>

      <!-- CATEGORY 3: SKETCHBOOK -->
      <div onclick="openCategory('sketchbook', 'SKETCHBOOK')" class="group relative aspect-[3/4] rounded-lg overflow-hidden cursor-pointer bg-neutral-900 border border-neutral-800/80 hover:border-amber-500/50 transition-all duration-300 shadow-xl">
        <img src="image19.jpg" 
             onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=1000&q=80';" 
             alt="Sketchbook" 
             class="card-zoom-img w-full h-full object-cover">
        <div class="absolute inset-0 bg-black/40 group-hover:bg-black/20 transition-colors duration-300 flex items-center justify-center p-6 text-center">
          <h2 class="text-2xl md:text-3xl font-extrabold tracking-[0.3em] text-white uppercase drop-shadow-lg group-hover:text-amber-400 transition-colors">
            SKETCHBOOK
          </h2>
        </div>
      </div>

    </section>

    <!-- CATEGORY GALLERY VIEW -->
    <section id="galleryView" class="hidden grid grid-cols-1 md:grid-cols-2 gap-8">
      <!-- Dynamic project cards injected via JS -->
    </section>

  </main>

  <div id="projectModal" class="fixed inset-0 z-50 hidden bg-black/95 backdrop-blur-md overflow-y-auto">
    <div class="min-h-screen px-4 md:px-12 py-10 flex flex-col items-center">
      
      <!-- Modal header & Close button -->
      <div class="w-full max-w-6xl flex justify-between items-center mb-8 pb-4 border-b border-neutral-800">
        <div>
          <h2 id="modalProjectTitle" class="text-xl md:text-2xl font-bold tracking-[0.2em] text-white uppercase"></h2>
          <p id="modalProjectSub" class="text-xs text-amber-500 tracking-[0.2em] uppercase mt-1"></p>
        </div>
        <button onclick="closeModal()" class="text-neutral-400 hover:text-white text-3xl font-light focus:outline-none px-3 py-1 border border-neutral-800 hover:border-neutral-600 rounded transition-colors">
          ✕
        </button>
      </div>

      <!-- Scrollable Image Gallery inside Modal -->
      <div id="modalImagesContainer" class="w-full"></div>
    </div>
  </div>

</body>
</html>

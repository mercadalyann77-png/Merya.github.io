<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yann Mercadal — Concept & Environment Art</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }

    /* BANNIÈRE */
    .hero-banner {
      width: 100%;
      height: 380px;
      background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(18, 18, 18, 1)), url('yann-mercadal-final (4).jpg');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 2rem;
      border-bottom: 1px solid #222;
    }

    .hero-title {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    .hero-subtitle {
      font-size: 0.95rem;
      color: #ccc;
      letter-spacing: 2px;
      margin-top: 0.4rem;
      text-transform: uppercase;
    }

    /* NAVIGATION / ONGLETS */
    nav.top-nav {
      display: flex;
      justify-content: center;
      gap: 2.5rem;
      margin-top: 1.8rem;
    }

    nav.top-nav a {
      color: #aaa;
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding-bottom: 4px;
      border-bottom: 2px solid transparent;
      transition: all 0.25s ease;
    }

    nav.top-nav a:hover, nav.top-nav a.active {
      color: #fff;
      border-bottom-color: #fff;
    }

    /* GRILLE ÉLARGIE AVEC MOINS DE BORDS */
    .portfolio-section {
      max-width: 1700px;
      margin: 2.5rem auto;
      padding: 0 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: #181818;
      cursor: pointer;
      overflow: hidden;
      border-radius: 3px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.7);
    }

    .card-img-wrapper {
      width: 100%;
      height: 320px;
      overflow: hidden;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .card:hover img {
      transform: scale(1.03);
    }

    .card-info {
      padding: 1rem 1.2rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 0.2rem;
    }

    .card-meta {
      font-size: 0.8rem;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* MODALE LIGHTBOX */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.94);
      overflow-y: auto;
      z-index: 1000;
      padding: 2rem 1rem;
    }

    .modal-content {
      max-width: 1300px;
      margin: 0 auto;
      background: #141414;
      border-radius: 4px;
      padding: 2.5rem;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 1.5rem; right: 2rem;
      font-size: 2.5rem;
      cursor: pointer;
      color: #888;
      transition: color 0.2s;
    }

    .close-btn:hover { color: #fff; }

    .modal-header {
      margin-bottom: 2rem;
      border-bottom: 1px solid #252525;
      padding-bottom: 1.5rem;
    }

    .modal-title {
      font-size: 1.8rem;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .modal-desc {
      color: #aaa;
      font-size: 0.95rem;
      max-width: 900px;
    }

    .modal-gallery {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .modal-gallery img {
      width: 100%;
      border-radius: 2px;
      display: block;
    }

    footer {
      max-width: 1700px;
      margin: 4rem auto 2rem auto;
      padding: 2rem 1rem;
      border-top: 1px solid #222;
      display: flex;
      justify-content: space-between;
      color: #555;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- BANNIÈRE AVEC ILLUSTRATION D'EN-TÊTE -->
  <header class="hero-banner">
    <div class="hero-title">Yann Mercadal</div>
    <div class="hero-subtitle">Concept Artist & Environment Artist</div>
    
    <!-- ONGLETS DE NAVIGATION -->
    <nav class="top-nav">
      <a href="#" class="active">Portfolio</a>
      <a href="#">Concept Art</a>
      <a href="#">3D & Sculpting</a>
      <a href="mailto:ton-email@gmail.com">Contact</a>
    </nav>
  </header>

  <!-- SECTION GALERIE -->
  <main class="portfolio-section">
    <div class="grid" id="portfolio-grid"></div>
  </main>

  <!-- FENÊTRE MODALE LIGHTBOX -->
  <div class="modal" id="project-modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title"></h2>
        <p class="modal-desc" id="modal-desc"></p>
      </div>
      <div class="modal-gallery" id="modal-gallery"></div>
    </div>
  </div>

  <footer>
    <div>&copy; 2026 Yann Mercadal. Tous droits réservés.</div>
    <div>Disponible pour du travail en Freelance / CDI</div>
  </footer>

  <script>
    const projects = [
      {
        title: "Projet 01 : ZBrush Character",
        category: "3D Sculpting & Character Design",
        thumb: "merya-render-artstation.jpg",
        desc: "Sculpt 3D de personnage réalisé sous ZBrush, comprenant les étapes de modélisation et de rendu d'impression/composition.",
        images: [
          "merya-render-artstation.jpg",
          "merya-render-zbrush.jpg",
          "merya-render-01.jpg"
        ]
      },
      {
        title: "Projet 02 : Myrmidon Studio Concept & Environment Art",
        category: "Concept Art / Worldbuilding",
        thumb: "yann-m-concept01.jpg",
        desc: "Recherches visuelles complètes pour le projet Myrmidon Studio : créations de personnages, accessoires, artefacts et décors.",
        images: [
          "yann-m-concept01.jpg",
          "yann-m-concept-nomades (2).jpg",
          "yann-m-concept-artefact.jpg",
          "yann-m-planche-chara.jpg",
          "yann-m-concept-environnement01.jpg",
          "yann-m-concept-monolith01v02 (1).jpg",
          "yann-m-concept-monolith02v02.jpg"
        ]
      },
      {
        title: "Projet 03 : Chevrolet Impala",
        category: "3D Asset & Vehicle Design",
        thumb: "yann-mercadal-chevrolet (1).jpg",
        desc: "Projet de modélisation et d'intégration d'une Chevrolet Impala dans un environnement cinématique.",
        images: [
          "yann-mercadal-chevrolet (1).jpg",
          "yann-mercadal-render-chevrolet (3).jpg"
        ]
      },
      {
        title: "Projet 04 : Desert Temple",
        category: "Environment Concept Art",
        thumb: "yann-mercadal-final (4).jpg",
        desc: "Études d'environnement désertique, architecture monolithique et recherches de composition de lumière.",
        images: [
          "yann-mercadal-final (4).jpg",
          "yann-mercadal-beauty.jpg",
          "yann-mercadal-n.jpg"
        ]
      }
    ];

    const grid = document.getElementById('portfolio-grid');
    projects.forEach((proj, index) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => openModal(index);
      card.innerHTML = `
        <div class="card-img-wrapper">
          <img src="${encodeURI(proj.thumb)}" alt="${proj.title}">
        </div>
        <div class="card-info">
          <div class="card-title">${proj.title}</div>
          <div class="card-meta">${proj.category}</div>
        </div>
      `;
      grid.appendChild(card);
    });

    function openModal(index) {
      const proj = projects[index];
      document.getElementById('modal-title').innerText = proj.title;
      document.getElementById('modal-desc').innerText = proj.desc;
      
      const gallery = document.getElementById('modal-gallery');
      gallery.innerHTML = proj.images.map(imgUrl => `<img src="${encodeURI(imgUrl)}" alt="Projet">`).join('');
      
      document.getElementById('project-modal').style.display = 'block';
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('project-modal').style.display = 'none';
      document.body.style.overflow = 'auto';
    }

    window.onclick = function(event) {
      const modal = document.getElementById('project-modal');
      if (event.target == modal) {
        closeModal();
      }
    }
  </script>
</body>
</html>

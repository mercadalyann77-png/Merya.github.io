<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yann Mercadal — Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0c0c0e;
      color: #f3f4f6;
    }

    .card-hover-zoom {
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .category-card:hover .card-hover-zoom {
      transform: scale(1.05);
    }

    .glass-nav {
      background: rgba(12, 12, 14, 0.85);
      backdrop-filter: blur(12px);
    }

    /* Modal transition styles */
    .modal-enter {
      opacity: 0;
      transform: scale(0.95);
    }
    .modal-enter-active {
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-black">

  <!-- HEADER -->
  <header class="pt-16 pb-8 text-center border-b border-neutral-800/60 px-4">
    <h1 class="text-3xl md:text-5xl font-extrabold tracking-[0.25em] uppercase text-white mb-2">
      YANN MERCADAL
    </h1>
    <p class="text-xs md:text-sm tracking-[0.3em] uppercase text-neutral-400 font-medium">
      Concept Art & 3D Sculpting Portfolio
    </p>
  </header>

  <!-- STICKY NAV BAR -->
  <nav class="sticky top-0 z-40 glass-nav border-b border-neutral-800/40 py-4 px-6 md:px-12 transition-all duration-300">
    <div class="max-w-7xl mx-auto flex justify-between items-center h-8">
      <button id="backBtn" onclick="showHome()" class="hidden flex items-center space-x-2 text-xs uppercase tracking-[0.2em] text-neutral-400 hover:text-white transition-colors duration-200 py-2 px-4 rounded border border-neutral-800 hover:border-neutral-600">
        <span>← ACCUEIL</span>
      </button>
      <div id="activeCategoryTitle" class="text-xs md:text-sm font-semibold tracking-[0.3em] uppercase text-amber-500/90">
        <!-- Dynamic Category Name -->
      </div>
      <div class="text-xs tracking-[0.2em] text-neutral-500 uppercase hidden md:block">
        Claire Hummel Inspired Architecture
      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 md:px-8 py-12 flex-grow w-full">
    
    <!-- HOME VIEW (3 CATEGORIES) -->
    <section id="homeView" class="grid grid-cols-1 md:grid-cols-3 gap-8 transition-opacity duration-300">
      
      <!-- CONCEPT ART -->
      <div onclick="openCategory('concept-art', 'Concept Art')" class="category-card relative aspect-[16/10] md:aspect-[3/4] rounded-lg overflow-hidden cursor-pointer group bg-neutral-900 border border-neutral-800/80 hover:border-amber-500/50 transition-all duration-300">
        <img src="yann-mercadal-final (4).jpg" onerror="this.src='https://placehold.co/800x1000/18181b/ffffff?text=Concept+Art'" alt="Concept Art" class="card-hover-zoom w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent flex flex-col justify-end p-6 md:p-8">
          <h2 class="text-2xl font-bold tracking-[0.2em] text-white uppercase mb-1 group-hover:text-amber-400 transition-colors">
            CONCEPT ART
          </h2>
          <span class="text-xs tracking-[0.2em] text-neutral-400 uppercase group-hover:text-neutral-200 transition-colors">
            Voir la galerie →
          </span>
        </div>
      </div>

      <!-- SCULPTURE -->
      <div onclick="openCategory('sculpture', 'Sculpture')" class="category-card relative aspect-[16/10] md:aspect-[3/4] rounded-lg overflow-hidden cursor-pointer group bg-neutral-900 border border-neutral-800/80 hover:border-amber-500/50 transition-all duration-300">
        <img src="merya-render-artstation.jpg" onerror="this.src='https://placehold.co/800x1000/18181b/ffffff?text=Sculpture'" alt="Sculpture" class="card-hover-zoom w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent flex flex-col justify-end p-6 md:p-8">
          <h2 class="text-2xl font-bold tracking-[0.2em] text-white uppercase mb-1 group-hover:text-amber-400 transition-colors">
            SCULPTURE
          </h2>
          <span class="text-xs tracking-[0.2em] text-neutral-400 uppercase group-hover:text-neutral-200 transition-colors">
            Voir la galerie →
          </span>
        </div>
      </div>

      <!-- SKETCHBOOK -->
      <div onclick="openCategory('sketchbook', 'Sketchbook')" class="category-card relative aspect-[16/10] md:aspect-[3/4] rounded-lg overflow-hidden cursor-pointer group bg-neutral-900 border border-neutral-800/80 hover:border-amber-500/50 transition-all duration-300">
        <img src="yann-m-concept01.jpg" onerror="this.src='https://placehold.co/800x1000/18181b/ffffff?text=Sketchbook'" alt="Sketchbook" class="card-hover-zoom w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent flex flex-col justify-end p-6 md:p-8">
          <h2 class="text-2xl font-bold tracking-[0.2em] text-white uppercase mb-1 group-hover:text-amber-400 transition-colors">
            SKETCHBOOK
          </h2>
          <span class="text-xs tracking-[0.2em] text-neutral-400 uppercase group-hover:text-neutral-200 transition-colors">
            Voir les croquis →
          </span>
        </div>
      </div>

    </section>

    <!-- CATEGORY GALLERY VIEW (DYNAMIC) -->
    <section id="galleryView" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-8 transition-opacity duration-300">
      <!-- Project cards injected via JavaScript -->
    </section>

  </main>

  <!-- MODAL FOR IMAGE INSPECTION -->
  <div id="imageModal" class="fixed inset-0 z-50 hidden bg-black/95 backdrop-blur-md flex items-center justify-center p-4 md:p-8">
    <button onclick="closeModal()" class="absolute top-6 right-6 text-white text-3xl font-light hover:text-amber-400 transition-colors focus:outline-none">
      &times;
    </button>
    <div class="max-w-5xl w-full max-h-[90vh] flex flex-col items-center">
      <img id="modalImg" src="" alt="Zoom" class="max-h-[75vh] w-auto object-contain rounded border border-neutral-800 shadow-2xl mb-4">
      <h3 id="modalTitle" class="text-lg md:text-xl font-semibold tracking-[0.2em] uppercase text-white text-center"></h3>
      <p id="modalDesc" class="text-xs md:text-sm text-neutral-400 tracking-widest uppercase mt-1 text-center"></p>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="border-t border-neutral-900 py-8 text-center text-xs text-neutral-600 tracking-widest uppercase">
    © <span id="year">2026</span> Yann Mercadal. All rights reserved.
  </footer>

  <script>
    document.getElementById('year').innerText = new Date().getFullYear();

    // PROJECT DATABASE
    const projectsData = {
      'concept-art': [
        {
          title: "DESERT TEMPLE",
          category: "ENVIRONMENT CONCEPT ART",
          desc: "Recherches d'environnement architectural et atmosphère désertique.",
          img: "yann-mercadal-final (4).jpg"
        },
        {
          title: "MYRMIDON",
          desc: "World building, ambiance narrative et illustration conceptuelle.",
          category: "CONCEPT ART & WORLD BUILDING",
          img: "yann-m-concept01.jpg"
        }
      ],
      'sculpture': [
        {
          title: "MERYA",
          category: "3D CHARACTER SCULPTING",
          desc: "Sculpture 3D numérique et texturation réaliste développée sur ZBrush.",
          img: "merya-render-artstation.jpg"
        },
        {
          title: "CHEVROLET IMPALA",
          category: "3D VEHICLE & ENVIRONMENT",
          desc: "Modélisation 3D haute précision du véhicule et intégration de la scène.",
          img: "yann-mercadal-render-chevrolet (3).jpg"
        }
      ],
      'sketchbook': [
        {
          title: "RECHERCHES DE CHARACTERS",
          category: "SKETCHBOOK & STUDIES",
          desc: "Planches d'études anatomiques, recherches d'attitudes et croquis préparatoires.",
          img: "yann-m-planche-chara.jpg"
        }
      ]
    };

    // OPEN CATEGORY GALLERY
    function openCategory(catKey, catName) {
      const homeView = document.getElementById('homeView');
      const galleryView = document.getElementById('galleryView');
      const backBtn = document.getElementById('backBtn');
      const activeCategoryTitle = document.getElementById('activeCategoryTitle');

      galleryView.innerHTML = '';
      const projects = projectsData[catKey] || [];

      projects.forEach(project => {
        const card = document.createElement('div');
        card.className = 'group bg-neutral-900/60 border border-neutral-800 rounded-lg overflow-hidden cursor-pointer hover:border-neutral-600 transition-all duration-300';
        card.onclick = () => openModal(project.img, project.title, project.desc);

        card.innerHTML = `
          <div class="aspect-video w-full overflow-hidden bg-neutral-950 relative">
            <img src="${project.img}" 
                 onerror="this.src='https://placehold.co/800x450/18181b/ffffff?text=${encodeURIComponent(project.title)}'" 
                 alt="${project.title}" 
                 class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
            <div class="absolute inset-0 bg-black/20 group-hover:bg-transparent transition-colors"></div>
          </div>
          <div class="p-6">
            <div class="text-[10px] tracking-[0.25em] text-amber-500/80 font-semibold uppercase mb-1">
              ${project.category}
            </div>
            <h3 class="text-lg font-bold tracking-[0.15em] text-white uppercase group-hover:text-amber-400 transition-colors">
              ${project.title}
            </h3>
            <p class="text-xs text-neutral-400 tracking-wider mt-2 line-clamp-2">
              ${project.desc}
            </p>
          </div>
        `;
        galleryView.appendChild(card);
      });

      homeView.classList.add('hidden');
      galleryView.classList.remove('hidden');
      backBtn.classList.remove('hidden');
      activeCategoryTitle.innerText = catName;

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // RETURN TO HOME VIEW
    function showHome() {
      const homeView = document.getElementById('homeView');
      const galleryView = document.getElementById('galleryView');
      const backBtn = document.getElementById('backBtn');
      const activeCategoryTitle = document.getElementById('activeCategoryTitle');

      homeView.classList.remove('hidden');
      galleryView.classList.add('hidden');
      backBtn.classList.add('hidden');
      activeCategoryTitle.innerText = '';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // MODAL FUNCTIONS
    function openModal(imgSrc, title, desc) {
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImg');
      const modalTitle = document.getElementById('modalTitle');
      const modalDesc = document.getElementById('modalDesc');

      modalImg.src = imgSrc;
      modalTitle.innerText = title;
      modalDesc.innerText = desc;
